# Runs the private V4-GUCAPI cache refresher on a free public runner.
#
# This repository holds NO source code. It checks out the private repo with a
# fine-grained, read-only PAT, installs that repo's dependencies, and runs its
# refresh script. Public repos get unlimited Actions minutes, so the hourly
# cadence costs nothing and the private repo's own quota stays untouched.
#
# Required secrets : SOURCE_REPO_PAT, REDIS_URL, ENCRYPTION_KEY
# Required variable: SOURCE_REPO  ->  owner/name ONLY, e.g. "yourname/V4-GUCAPI"
#   A URL ("https://github.com/yourname/V4-GUCAPI") is REJECTED by checkout.
# Where each value comes from -> README.md
#
# NOTE: this file must live at .github/workflows/refresh-cache.yml on the
# DEFAULT branch, or GitHub will never schedule it.

name: Refresh Cache Sections

on:
  schedule:
    # Fast kinds hourly: guc_data, grades, attendance, exam_seats,
    # cms_notifications. Batched single-process run costs ~100-200 Redis
    # commands total — quota-safe by design.
    - cron: "0 * * * *"
    # Slow kinds daily at 01:00 UTC (03:00 Cairo, low traffic): schedule +
    # cms_courses lists + global cms_content. TTLs are 48h so one missed run
    # never expires into a request-path miss.
    - cron: "0 1 * * *"
  workflow_dispatch:
    inputs:
      username:
        description: "Specific username to refresh (optional, leave empty for all)"
        required: false
      refresh_schedule:
        description: "Type YES to force schedule refresh (slow kind)"
        required: false
        default: "no"
      refresh_cms:
        description: "Type YES to force cms_courses refresh (slow kind)"
        required: false
        default: "no"

# Never let two runs overlap, and never cancel one mid-write: the refresher
# batches Redis writes and a half-finished run is worse than a late one.
concurrency:
  group: refresh-cache
  cancel-in-progress: false

# The default GITHUB_TOKEN is not used anywhere below — the checkout
# authenticates with the scoped PAT — so this repo grants itself no write
# access at all.
permissions:
  contents: read

jobs:
  refresh_sections:
    runs-on: ubuntu-latest
    # A full all-users sweep runs every scrape through the sequential
    # requests_ntlm fallback (the runner's libcurl has no NTLM), so wall-clock
    # is dominated by NTLM handshakes and by the retry/backoff on users whose
    # credentials upstream rejects. Measured runs blew past 14 minutes; a bad
    # day with many 401s can approach an hour. 180 is the budget, not the norm.
    timeout-minutes: 180
    steps:
      # Pinned to a commit SHA, not a tag: a mutable tag could be repointed at
      # malicious code that would then run with the secrets below in scope.
      # v4.4.0
      - name: Checkout source repo (private, read-only PAT)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ${{ vars.SOURCE_REPO }}
          token: ${{ secrets.SOURCE_REPO_PAT }}
          persist-credentials: false

      # v5.6.0
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"

      # pycurl is built from source here; it needs the libcurl/OpenSSL headers.
      - name: Install prerequisites (Ubuntu)
        run: |
          sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev libssl-dev

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Determine target
        id: args
        run: |
          USERNAME="${{ github.event.inputs.username || '' }}"
          echo "username=${USERNAME}" >> "$GITHUB_OUTPUT"
          echo "Target Username: '${USERNAME:-<all users>}'"

      # Manual inputs arrive as environment variables, never spliced into the
      # script text, so a crafted username cannot execute shell commands.
      - name: Refresh (schedule-aware + manual YES flags)
        env:
          REDIS_URL: ${{ secrets.REDIS_URL }}
          ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
          VERIFY_SSL: "True"
          LOG_LEVEL: INFO
          EVENT: ${{ github.event_name }}
          SCHED: ${{ github.event.schedule }}
          TARGET: ${{ steps.args.outputs.username }}
          RS: ${{ github.event.inputs.refresh_schedule || 'no' }}
          RC: ${{ github.event.inputs.refresh_cms || 'no' }}
        run: |
          set -euo pipefail

          # Case-insensitive YES check for the manual flags.
          is_yes() { echo "$1" | grep -iq '^yes$'; }

          if [ "${EVENT}" = "schedule" ]; then
            if [ "${SCHED}" = "0 1 * * *" ]; then
              echo "Scheduled daily slow run (schedule + cms_courses + cms_content)"
              python scripts/refresh_cache.py slow
            else
              echo "Scheduled hourly fast run"
              python scripts/refresh_cache.py fast
            fi
            exit 0
          fi

          # Manual dispatch: always refresh fast kinds, plus slow kinds only
          # when their flag is YES (any case). Username scoping applies to all.
          echo "Manual run target: ${TARGET:-all users} refresh_schedule=${RS} refresh_cms=${RC}"
          if [ -z "${TARGET}" ]; then
            python scripts/refresh_cache.py fast
          else
            python scripts/refresh_cache.py fast "${TARGET}"
          fi
          if is_yes "${RS}"; then
            echo "Forcing schedule refresh"
            if [ -z "${TARGET}" ]; then
              python scripts/refresh_cache.py schedule
            else
              python scripts/refresh_cache.py schedule "${TARGET}"
            fi
          fi
          if is_yes "${RC}"; then
            echo "Forcing cms_courses refresh"
            if [ -z "${TARGET}" ]; then
              python scripts/refresh_cache.py cms_courses
            else
              python scripts/refresh_cache.py cms_courses "${TARGET}"
            fi
          fi
